name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Lint repository
        run: npm run lint
      - name: Test frontend with coverage
        run: npm test
      - name: Build production frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck backend
        run: npm run typecheck --workspace @relayform/api
      - name: Lint backend
        run: npm run lint --workspace @relayform/api
      - name: Test backend with coverage
        run: npm test --workspace @relayform/api

  deployment-configuration:
    name: Deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_ENV_FILE: ops/appEnv.example.env
      APP_TOKENS_FILE: ops/serviceTokens.example.env
      APP_HTTP_PORT: "3000"
      POSTGRES_PASSWORD: compose-validation-only
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate production Compose
        run: docker compose -f dockerCompose.production.yml config --quiet
